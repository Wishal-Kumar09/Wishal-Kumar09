<svg xmlns="http://www.w3.org/2000/svg"
     width="486"
     height="387"
     viewBox="0 0 486 387"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <clipPath id="terminalClip">
      <rect x="0" y="0" width="486" height="387" rx="12"/>
    </clipPath>

    <clipPath id="outputClip">
      <rect x="18" y="72" width="450" height="285"/>
    </clipPath>
  </defs>

  <rect width="486" height="387" rx="12"
        fill="url(#bg)"
        stroke="#30363d"/>

  <g clip-path="url(#terminalClip)">

    <rect x="0" y="0" width="486" height="48"
          fill="#0d1117"/>

    <circle cx="20" cy="24" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="24" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="24" r="6" fill="#27c93f"/>

    <text x="243" y="29"
          text-anchor="middle"
          font-size="13"
          fill="#8b949e">
      whyshal@github: ~$ Why-am-i
    </text>

    <g clip-path="url(#outputClip)"
       fill="#c9d1d9"
       font-size="14">

      <text x="18" y="82">
        <tspan fill="#58a6ff">whyshal@github</tspan>
        <tspan fill="#8b949e">:~$ </tspan>
        <tspan>Why-am-i</tspan>
      </text>

      <text x="18" y="112">Whyshal</text>

      <text x="18" y="142">
        <tspan fill="#8b949e">role</tspan>
        <tspan>        → Analytics Engineer</tspan>
      </text>

      <text x="18" y="168">
        <tspan fill="#8b949e">focus</tspan>
        <tspan>       → Machine Learning</tspan>
      </text>

      <text x="18" y="194">
        <tspan fill="#8b949e">exploring</tspan>
        <tspan>   → Data Science</tspan>
      </text>

      <text x="18" y="220">
        <tspan fill="#8b949e">building</tspan>
        <tspan>    → Real-world projects</tspan>
      </text>

      <text x="18" y="246">
        <tspan fill="#8b949e">learning</tspan>
        <tspan>    → AI / ML</tspan>
      </text>

      <text x="18" y="272">
        <tspan fill="#8b949e">stack</tspan>
        <tspan>       → Python · SQL · Git</tspan>
      </text>

      <text x="18" y="298">
        <tspan fill="#8b949e">mindset</tspan>
        <tspan>     → Learn → Build → Repeat</tspan>
      </text>

      <text x="18" y="332">
        <tspan fill="#58a6ff">whyshal@github</tspan>
        <tspan fill="#8b949e">:~$ </tspan>
        <tspan>echo "keep building"</tspan>
      </text>

      <text x="18" y="354">
        keep building
      </text>

    </g>

    <rect x="18" y="360" width="8" height="15" fill="#c9d1d9">
      <animate attributeName="opacity"
               values="1;1;0;0;1"
               dur="1s"
               repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
